# INTEGRATION-CONSOLIDATION-001 — sub-rede própria para um terceiro laboratório (C4) (a API não é alterada). O compose da stack E2E fixa
# 10.251.47.0/24 e os endereços de cada serviço; um laboratório anterior, parado e PRESERVADO para revisão, continua dono
# dessa sub-rede. Este complemento troca só a sub-rede, os endereços e o proxy confiável (o nginx), na mesma disposição.
networks:
  e2e:
    ipam:
      config: !override
        - subnet: 10.251.49.0/24

services:
  postgres:
    networks:
      e2e:
        ipv4_address: 10.251.49.20
  redis:
    networks:
      e2e:
        ipv4_address: 10.251.49.21
  platform:
    environment:
      NEKKORA_PROXIES_CONFIAVEIS: 10.251.49.10/32
    networks:
      e2e:
        ipv4_address: 10.251.49.30
  portal:
    environment:
      NEKKORA_PROXIES_CONFIAVEIS: 10.251.49.10/32
    networks:
      e2e:
        ipv4_address: 10.251.49.31
  agent-gateway:
    environment:
      NEKKORA_PROXIES_CONFIAVEIS: 10.251.49.10/32
    networks:
      e2e:
        ipv4_address: 10.251.49.32
  nginx:
    networks:
      e2e:
        ipv4_address: 10.251.49.10
