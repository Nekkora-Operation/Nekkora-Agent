# Origem fixada das bibliotecas visuais Nekkora usadas pelo Agent (AGENT-001, decisão D-02).
#
# As bibliotecas nekkora-design-tokens e nekkora-swing-ui ainda não têm artefato versionado publicado.
# tools/prepare-design-system.ps1 constrói exatamente estes módulos a partir deste commit do Studio,
# sem alterar os fontes dele, em um repositório Maven local isolado (.design-system/m2), e registra
# as impressões digitais SHA-256 em .design-system/design-system.lock.properties.
# A construção do Agent usa somente esse repositório isolado (.mvn/maven.config) e o teste
# DesignSystemProvenanceTest confere a origem dos JARs efetivamente carregados.

